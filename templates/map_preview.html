<!DOCTYPE html>
<html>

<head>

<title>Location Preview</title>

<style>

body{
    text-align:center;
    font-family:Arial;
    background:#f1f5f9;
}

h1{
    margin-top:30px;
    color:#1e3a8a;
}

canvas{
    margin-top:20px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

button{
    margin-top:30px;
    padding:15px 30px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

</style>

</head>

<body>

<h1>
    YOU ARE HERE : {{ source }}
</h1>

<canvas id="mapCanvas"></canvas>

<br>

<button onclick="window.location.href='/navigation?source={{ source }}'">

ENTER NAVIGATION

</button>

<script>

const markerX = {{ marker_x }};
const markerY = {{ marker_y }};

const canvas =
      document.getElementById("mapCanvas");

const ctx =
      canvas.getContext("2d");

const img = new Image();

img.src =
"/static/campus_map.png";

img.onload = function(){

    canvas.width =
        img.width;

    canvas.height =
        img.height;

    ctx.drawImage(
        img,
        0,
        0
    );

    ctx.beginPath();

    ctx.arc(
        markerX,
        markerY,
        20,
        0,
        2*Math.PI
    );

    ctx.fillStyle = "red";

    ctx.fill();

    ctx.font =
        "20px Arial";

    ctx.fillStyle =
        "black";

    ctx.fillText(
        "You Are Here",
        markerX + 25,
        markerY
    );
};

</script>
<script>

setInterval(function(){

    location.reload();

},3000);

</script>
</body>
</html>

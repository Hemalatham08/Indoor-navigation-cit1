<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WELCOME TO CIT</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;

            /* Beautiful Gradient Background */
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #06b6d4);

            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.12);
            padding: 50px 35px;
            border-radius: 25px;
            backdrop-filter: blur(10px);

            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);

            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: white;
            font-size: 42px;
            margin-bottom: 15px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        h2 {
            color: #dbeafe;
            font-size: 18px;
            margin-bottom: 35px;
            font-weight: 300;
        }

        img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background-color: white;
            padding: 10px;
            margin-bottom: 30px;

            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
        }

        button {
            background: linear-gradient(45deg, #06b6d4, #2563eb);

            color: white;
            padding: 15px 35px;

            border: none;
            border-radius: 50px;

            font-size: 18px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.4s ease;
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);

            background: linear-gradient(45deg, #0891b2, #1d4ed8);
        }

        .glow {
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #fff,
                             0 0 20px #38bdf8,
                             0 0 30px #38bdf8;
            }

            to {
                text-shadow: 0 0 20px #fff,
                             0 0 30px #0ea5e9,
                             0 0 40px #0ea5e9;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <h1 class="glow">WELCOME TO CIT</h1>

        <h2>Chennai Institute of Technology Navigation System</h2>

        <img src="{{ url_for('static', filename='citlogo.png') }}" alt="CIT Logo" class="logo">

        <br>

        <button type="button"
            onclick="window.location.href='/map?source={{ source }}'">
            CLICK HERE TO NAVIGATE
        </button>

    </div>

</body>

</html>
